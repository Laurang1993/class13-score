    const input = document.getElementById('nameInput');
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') searchStudent();
    });

    function normalizeName(value) {
      return String(value || '').replace(/\s+/g, '').trim();
    }

    function formatScore(score) {
      const n = Number(score);
      if (Number.isNaN(n)) return String(score);
      return n > 0 ? '+' + n : String(n);
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, function(ch) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[ch];
      });
    }

    function renderStudent(stu) {
      const rows = stu.details.map((item, index) => {
        const n = Number(item.score);
        const cls = n >= 0 ? 'plus' : 'minus';
        const type = n >= 0 ? '加分' : '扣分';
        return `
          <tr>
            <td>${index + 1}</td>
            <td><span class="tag ${cls}">${type} ${escapeHtml(formatScore(item.score))}</span></td>
            <td>${escapeHtml(item.reason)}</td>
          </tr>
        `;
      }).join('');

      const penaltyText = Number(stu.penalty) === 0 ? '0' : String(stu.penalty);

      return `
        <div class="student-card">
          <div class="student-head">
            <div>
              <div class="student-name">${escapeHtml(stu.name)}</div>
              <div class="period">2026年9月1日开学至10月14日奖罚情况</div>
            </div>
            <div class="score-box">
              <div class="score-label">当前总分</div>
              <div class="score-value">${escapeHtml(stu.total)}</div>
            </div>
          </div>

          <div class="summary">
            <div class="metric">
              <div class="label">基础分</div>
              <div class="value">${escapeHtml(stu.base)}</div>
            </div>
            <div class="metric">
              <div class="label">累计加分</div>
              <div class="value plus">+${escapeHtml(stu.reward)}</div>
            </div>
            <div class="metric">
              <div class="label">累计扣分</div>
              <div class="value minus">${escapeHtml(penaltyText)}</div>
            </div>
          </div>

          <div class="section-title">具体奖罚记录</div>
          <table>
            <thead>
              <tr>
                <th style="width:60px;">序号</th>
                <th style="width:110px;">分值</th>
                <th>日期与理由</th>
              </tr>
            </thead>
            <tbody>
              ${rows || '<tr><td colspan="3">暂无奖罚记录。</td></tr>'}
            </tbody>
          </table>
        </div>
      `;
    }

    function searchStudent() {
      const key = normalizeName(input.value);
      const result = document.getElementById('result');

      if (!key) {
        result.innerHTML = '<div class="error">请先输入学生姓名。</div>';
        input.focus();
        return;
      }

      const matches = STUDENTS.filter(stu => normalizeName(stu.name) === key);

      if (matches.length === 0) {
        result.innerHTML = '<div class="error">未查询到该姓名。请确认姓名是否输入完整、是否与表格一致。</div>';
        return;
      }

      result.innerHTML = matches.map(renderStudent).join('');
    }
  </script>
